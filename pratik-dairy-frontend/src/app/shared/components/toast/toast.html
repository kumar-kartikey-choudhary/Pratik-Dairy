<div class="toasts" role="status" aria-live="polite">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast toast--{{ toast.kind }}">
      <span class="toast__msg">{{ toast.message }}</span>
      <button
        type="button"
        class="toast__close"
        aria-label="Dismiss"
        (click)="toastService.dismiss(toast.id)"
      >
        ×
      </button>
    </div>
  }
</div>
