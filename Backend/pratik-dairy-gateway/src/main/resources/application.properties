spring.application.name=PRATIK-DAIRY-GATEWAY

server.port= 8080


eureka.instance.prefer-ip-address = true
eureka.client.fetch-registry = true
eureka.client.register-with-eureka = true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/


jwt.secret="pratikdairypratikdairypratikdairypratikdairy"


spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true


# -------- USER SERVICE --------
spring.cloud.gateway.server.webflux.routes[0].id=PRATIK-DAIRY-USER
spring.cloud.gateway.server.webflux.routes[0].uri=lb://PRATIK-DAIRY-USER
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**
#spring.cloud.gateway.server.webflux.routes[0].filters[0]=@jwtAuthentication
# Deduplicate CORS headers coming from microservices
spring.cloud.gateway.default-filters[0]=DeduplicateResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST


# -------- PRODUCT SERVICE --------
spring.cloud.gateway.server.webflux.routes[1].id=PRATIK-DAIRY-PRODUCT
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PRATIK-DAIRY-PRODUCT
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/products/**
#spring.cloud.gateway.server.webflux.routes[1].filters[0]=JwtAuthentication
# Deduplicate CORS headers coming from microservices
spring.cloud.gateway.default-filters[1]=DeduplicateResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# -------- ORDER SERVICE --------
spring.cloud.gateway.server.webflux.routes[2].id=PRATIK-DAIRY-ORDER
spring.cloud.gateway.server.webflux.routes[2].uri=lb://PRATIK-DAIRY-ORDER
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/orders/**
#spring.cloud.gateway.server.webflux.routes[2].filters[0]=JwtAuthentication


# -------- CART SERVICE --------
spring.cloud.gateway.server.webflux.routes[3].id=PRATIK-DAIRY-CART
spring.cloud.gateway.server.webflux.routes[3].uri=lb://PRATIK-DAIRY-CART
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/carts/**
#spring.cloud.gateway.server.webflux.routes[3].filters[0]=JwtAuthentication
spring.cloud.gateway.default-filters[3]=DeduplicateResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST