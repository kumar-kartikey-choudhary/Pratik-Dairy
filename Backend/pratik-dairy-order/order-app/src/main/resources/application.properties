spring.application.name=PRATIK-DAIRY-ORDER


spring.datasource.driver-class-name = org.mariadb.jdbc.Driver
spring.datasource.url = jdbc:mariadb://localhost:3306/pratik_dairy_order?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username = root
spring.datasource.password = 123456
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

server.port = 8083
product.url=http://localhost:8082
cart.url=http://localhost:8085
spring.cloud.openfeign.okhttp.enabled=true

jwt.secret=pratikdairypratikdairypratikdairypratikdairy

spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true


#Eureka configuration
eureka.instance.prefer-ip-address = true
eureka.client.fetch-registry = true
eureka.client.register-with-eureka = true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Circuit breaker
resilience4j.circuitbreaker.instances.productService.sliding-window-size=10
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=10s
resilience4j.timelimiter.instances.productService.timeout-duration=3s