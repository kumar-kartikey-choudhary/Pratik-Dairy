spring.datasource.url = jdbc:mariadb://localhost:3306/pratik_dairy_order?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username = root
spring.datasource.password = ${DB_PASSWORD: 123456}
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

server.port = 8083


jwt.secret=pratikdairypratikdairypratikdairypratikdairy

spring.jpa.hibernate.ddl-auto = update
